<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>家事寫入診斷</title><body><button id="run">檢查家事寫入</button><pre id="out"></pre><script type="module">
import {firebaseConfig} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth,signInAnonymously,browserLocalPersistence,setPersistence} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {getFirestore,doc,getDoc,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const out=document.querySelector('#out');const log=(label,value)=>out.textContent+=label+': '+value+'\n';
document.querySelector('#run').onclick=async()=>{
out.textContent='';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
try{
 await setPersistence(auth,browserLocalPersistence);await auth.authStateReady();const user=auth.currentUser||(await signInAnonymously(auth)).user;
 const homeId=localStorage.getItem('little-home-code');log('home',homeId||'none');if(!homeId)return;
 const profile=await getDoc(doc(db,'homes',homeId,'profiles',user.uid));log('profile exists',profile.exists());
 const home=await getDoc(doc(db,'homes',homeId));log('home exists',home.exists());
 for(const [label,day] of [['half-hour',Math.floor(Date.now()/1800000)],['hour',Math.floor(Date.now()/3600000)]]){
  const ref=doc(db,'homes',homeId,'days',String(day),'claims','diagnostic-'+label);
  try{await runTransaction(db,async tx=>{const old=await tx.get(ref);if(!old.exists())tx.set(ref,{uid:user.uid,name:'測試',at:serverTimestamp()})});log(label,'OK')}
  catch(e){log(label,e.code+' '+e.message)}
 }
}catch(e){log('setup',e.code+' '+e.message)}
};</script></body></html>
