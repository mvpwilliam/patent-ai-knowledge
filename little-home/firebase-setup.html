<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭連線設定</title><style>body{font:16px/1.7 -apple-system,BlinkMacSystemFont,"Microsoft JhengHei",sans-serif;background:#f7f6f0;color:#344b43;max-width:680px;margin:30px auto;padding:0 20px}h1{font-size:25px}button,a.action{display:block;text-align:center;background:#405f50;color:white;border:0;border-radius:12px;padding:13px 18px;font:inherit;text-decoration:none;margin:16px 0;width:100%;box-sizing:border-box}textarea{width:100%;height:250px;box-sizing:border-box;font:12px/1.5 monospace;border:1px solid #cbd6c9;border-radius:12px;padding:12px}small{color:#788a7d}</style><h1>最後一步：發佈資料庫規則</h1><p>你的 games 專案已建立。把下方規則貼到 Firebase，家人就能用匿名登入一起玩。</p><ol><li>按「複製完整規則」。</li><li>開啟 Firestore，選「規則／Rules」分頁。</li><li>用這份內容取代原本規則，按「發佈／Publish」。</li><li>回遊戲重新整理；第一次會自動建立家庭，按「分享邀請連結」邀請家人。</li></ol><button id="copy">複製完整規則</button><p id="status" role="status"></p><textarea id="rules" readonly aria-label="完整資料庫規則"></textarea><a class="action" href="https://console.firebase.google.com/project/games-9d523/firestore" target="_blank" rel="noopener">開啟 Firestore 控制台</a><a class="action" href="./">回家中遊戲</a><small>家庭邀請連結可加入你家，分享給家人即可。同一裝置的瀏覽器會記住你的匿名身分。</small><script>const rules="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function signedIn() { return request.auth != null; }\n    function validHome(homeId) {\n      return homeId.matches('^[a-f0-9]{24}$');\n    }\n    function member(homeId) {\n      return signedIn() && exists(/databases/$(database)/documents/homes/$(homeId)/profiles/$(request.auth.uid));\n    }\n    function validProfile() {\n      let d = request.resource.data;\n      return d.keys().hasOnly(['name','skin','hair','hairColor','shirt'])\n        && d.keys().hasAll(['name','skin','hair','hairColor','shirt'])\n        && d.name is string && d.name.size() > 0 && d.name.size() <= 12\n        && d.hair in ['korean','long','cap']\n        && d.skin is string && d.skin.matches('^#[a-fA-F0-9]{6}$')\n        && d.hairColor is string && d.hairColor.matches('^#[a-fA-F0-9]{6}$')\n        && d.shirt is string && d.shirt.matches('^#[a-fA-F0-9]{6}$');\n    }\n    match /homes/{homeId} {\n      allow get: if signedIn() && validHome(homeId);\n      allow list: if false;\n      allow create: if signedIn() && validHome(homeId)\n        && request.resource.data.keys().hasOnly(['ownerUid','createdAt'])\n        && request.resource.data.ownerUid == request.auth.uid\n        && request.resource.data.createdAt == request.time;\n      allow update, delete: if false;\n      match /profiles/{uid} {\n        allow get: if signedIn() && (request.auth.uid == uid || member(homeId));\n        allow list: if member(homeId);\n        allow create, update: if signedIn() && validHome(homeId)\n          && request.auth.uid == uid\n          && exists(/databases/$(database)/documents/homes/$(homeId))\n          && validProfile();\n        allow delete: if false;\n      }\n      match /settings/tasks {\n        allow read: if member(homeId);\n        allow create, update: if member(homeId)\n          && request.resource.data.keys().hasOnly(['items'])\n          && request.resource.data.items is list\n          && request.resource.data.items.size() > 0\n          && request.resource.data.items.size() <= 30;\n        allow delete: if false;\n      }\n      match /days/{day}/claims/{taskId} {\n        allow read: if member(homeId);\n        allow create: if member(homeId)\n          && day == string(math.floor(request.time.toMillis() / 1800000))\n          && request.resource.data.keys().hasOnly(['uid','name','at'])\n          && request.resource.data.uid == request.auth.uid\n          && request.resource.data.name is string\n          && request.resource.data.name.size() > 0\n          && request.resource.data.name.size() <= 12\n          && request.resource.data.at == request.time;\n        allow update, delete: if false;\n      }\n    }\n  }\n}\n";document.getElementById('rules').value=rules;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(rules);document.getElementById('status').textContent='已複製，接著貼到 Firestore 的規則分頁。';}catch(e){const field=document.getElementById('rules');field.focus();field.select();field.setSelectionRange(0,field.value.length);document.getElementById('status').textContent='請長按選取的文字，點「複製」。';}};</script></html>
