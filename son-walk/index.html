    button { appearance: none; border: 0; background: #1c55ba; color: #fff; border-radius: 16px; padding: 13px 24px; font-size: 16px; font-weight: 750; box-shadow: 0 4px 8px #21467822; cursor: pointer; }
    button:focus-visible { outline: 3px solid #f69d42; outline-offset: 3px; }
    .sub { margin: 0; color: #587286; font-size: 13px; line-height: 1.5; text-align: center; }
    @media (max-height: 620px) { .stage { min-height: 340px; } .figure-shell { width: min(78%, 320px); } }
  </style>
</head>
<body>
  <main>
    <header><h1>會走路的 Q 版人偶</h1><span class="badge">貼圖造型</span></header>
    <section class="stage" id="stage" role="img" aria-label="以兒子的貼圖造型製作，正在走路的動畫人偶">
      <div class="scene"><div class="figure-shell"><div class="figure"></div></div></div><div class="shadow"></div>
    </section>
    <div class="controls"><button type="button" id="toggle" aria-pressed="false">暫停走路</button></div>
    <p class="sub">沿用貼圖的臉型、短刺髮和穿著，呈現走路動畫。</p>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const toggle = document.getElementById('toggle');
    toggle.addEventListener('click', () => {
      const paused = stage.classList.toggle('paused');
      toggle.textContent = paused ? '繼續走路' : '暫停走路';
      toggle.setAttribute('aria-pressed', String(paused));
    });
  </script>
</body>
</html>
